<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1D4262"/>
      <stop offset="1" stop-color="#0D1B29"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B87B8"/>
      <stop offset="1" stop-color="#1A4B6E"/>
    </linearGradient>
    <clipPath id="dial"><circle cx="256" cy="262" r="150"/></clipPath>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- sea / tide inside the dial -->
  <g clip-path="url(#dial)">
    <path d="M90,300 C140,250 190,250 240,292 C290,334 340,334 390,292 C410,275 425,266 440,262 L440,440 L90,440 Z" fill="url(#sea)"/>
    <path d="M90,300 C140,250 190,250 240,292 C290,334 340,334 390,292 C410,275 425,266 440,262" fill="none" stroke="#9FD0EE" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- instrument ring and ticks -->
  <circle cx="256" cy="262" r="164" fill="none" stroke="#E4ECF1" stroke-width="16"/>
  <g stroke="#E4ECF1" stroke-width="10" stroke-linecap="round">
    <line x1="256" y1="98" x2="256" y2="124"/>
    <line x1="420" y1="262" x2="394" y2="262"/>
    <line x1="92" y1="262" x2="118" y2="262"/>
  </g>

  <!-- wind pointer (from the north-west), in the app's magenta -->
  <g transform="rotate(-50 256 262)">
    <path d="M256,166 L220,70 L292,70 Z" fill="#E0579F" stroke="#0F2233" stroke-width="6" stroke-linejoin="round"/>
  </g>
</svg>
