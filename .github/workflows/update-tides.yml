name: Update NZ tide tables

# Downloads LINZ tide predictions for every NZ tide station and saves them
# in the "tides" folder for the Helm Weather app.
# Runs by itself on the 1st of each month, or tap "Run workflow" to run it now.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 15 1 * *"

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Get the app files
        uses: actions/checkout@v4

      - name: Download LINZ tide tables
        run: |
          python3 - <<'PY'
          import html, json, os, re, sys, time, unicodedata
          import urllib.parse, urllib.request
          from datetime import datetime, timedelta, timezone

          LIST_URL = "https://www.linz.govt.nz/products-services/tides-and-tidal-streams/tide-predictions/tide-predictions-list-view"
          UA = {"User-Agent": "Mozilla/5.0 (helm-weather tide updater)"}
          OUT = "tides"

          def get(url):
              req = urllib.request.Request(url, headers=UA)
              with urllib.request.urlopen(req, timeout=60) as r:
                  return r.read().decode("utf-8-sig", errors="replace")

          def slug(name):
              s = unicodedata.normalize("NFKD", name).encode("ascii", "ignore").decode()
              return re.sub(r"[^a-z0-9]+", "-", s.lower()).strip("-")

          def find_csv_links(page):
              links = {}
              for href in re.findall(r'href="([^"]*tide-tables/maj-ports/csv/[^"]+?\.csv)"', page):
                  href = html.unescape(href)
                  path = urllib.parse.unquote(href)
                  m = re.search(r"/csv/(.+) (\d{4})\.csv$", path)
                  if m:
                      links.setdefault(m.group(1), {})[int(m.group(2))] = path
              return links

          def coord(text, pos, neg):
              m = re.search(r"(\d+)\D+(\d+)\D*'?\s*([" + pos + neg + "])", text)
              if not m:
                  return None
              v = int(m.group(1)) + int(m.group(2)) / 60
              return round(-v if m.group(3) == neg else v, 4)

          def parse_csv(text):
              lines = text.splitlines()
              head = lines[0] if lines else ""
              parts = head.split(",")
              lat = coord(",".join(parts[2:3]), "N", "S")
              lon = coord(",".join(parts[3:4]), "E", "W")
              events = []
              for line in lines:
                  f = [c.strip().strip('"') for c in line.split(",")]
                  if len(f) < 6:
                      continue
                  try:
                      d, mo, y = int(f[0]), int(f[2]), int(f[3])
                  except ValueError:
                      continue
                  if not (1 <= d <= 31 and 1 <= mo <= 12 and y > 2000):
                      continue
                  for k in range(4, len(f) - 1, 2):
                      t = re.match(r"^(\d{1,2}):?(\d{2})$", f[k])
                      try:
                          h = float(f[k + 1])
                      except ValueError:
                          continue
                      if t:
                          events.append([f"{y:04d}-{mo:02d}-{d:02d}T{int(t.group(1)):02d}:{t.group(2)}", h])
              return lat, lon, events

          def main():
              now = datetime.now(timezone.utc) + timedelta(hours=12)  # roughly NZ time
              years = [now.year - 1, now.year, now.year + 1]
              keep_from = (now - timedelta(days=10)).strftime("%Y-%m-%dT00:00")

              links = find_csv_links(get(LIST_URL))
              if not links:
                  sys.exit("Could not find any LINZ tide files on the list page.")
              print(f"Found {len(links)} LINZ tide stations")

              os.makedirs(OUT, exist_ok=True)
              index = []
              for name in sorted(links):
                  lat = lon = None
                  events = []
                  for y in years:
                      path = links[name].get(y)
                      if not path:
                          continue
                      url = urllib.parse.quote(path, safe="/:")
                      try:
                          la, lo, ev = parse_csv(get(url))
                      except Exception as e:
                          print(f"  skip {name} {y}: {e}")
                          continue
                      lat = lat if lat is not None else la
                      lon = lon if lon is not None else lo
                      events += [e for e in ev if e[0] >= keep_from]
                      time.sleep(0.3)
                  if lat is None or lon is None or not events:
                      print(f"  no usable data for {name}")
                      continue
                  events.sort(key=lambda e: e[0])
                  sid = slug(name)
                  with open(os.path.join(OUT, sid + ".json"), "w") as fh:
                      json.dump({"name": name, "lat": lat, "lon": lon, "events": events}, fh, separators=(",", ":"))
                  index.append({"id": sid, "name": name, "lat": lat, "lon": lon})
                  print(f"  {name}: {len(events)} tides")

              with open(os.path.join(OUT, "index.json"), "w") as fh:
                  json.dump({"generated": datetime.now(timezone.utc).isoformat(timespec="minutes"),
                             "source": "LINZ Toitu Te Whenua tide predictions",
                             "stations": index}, fh, separators=(",", ":"))
              print(f"Wrote {len(index)} stations")

          if __name__ == "__main__":
              main()
          PY

      - name: Save the tide files
        run: |
          git config user.name "tide-updater"
          git config user.email "tide-updater@users.noreply.github.com"
          git add tides
          git diff --cached --quiet && echo "No changes" || (git commit -m "Update NZ tide tables" && git push)

      - name: Refresh the live site
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
